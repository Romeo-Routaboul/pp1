<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Invitados - PP1</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Gestión de Invitados</h1>
        <p>Agrega usuarios al evento seleccionado.</p>
    </header>

    <main>
        <section>
            <h2>Agregar invitado</h2>
            <form id="form-invitado" action="/register" method="post">
                <label for="nombre-invitado">Nombre:</label>
                <input type="text" id="nombre-invitado" name="first_name" maxlength="80" required>

                <label for="apellido-invitado">Apellido:</label>
                <input type="text" id="apellido-invitado" name="last_name" maxlength="80" required>

                <label for="email-invitado">Email:</label>
                <input type="email" id="email-invitado" name="email" required>

                <label for="password-invitado">Contraseña:</label>
                <input type="password" id="password-invitado" name="password" maxlength="1024" required>

                <fieldset>
                    <legend>Rol</legend>
                    <input type="radio" id="anfitrion" name="role" value="anfitrion">
                    <label for="anfitrion">Anfitrión</label>
                    <input type="radio" id="invitado" name="role" value="invitado" checked>
                    <label for="invitado">Invitado</label>
                </fieldset>

                <button id="submit-invitado" type="submit">Agregar</button>
            </form>
            <p id="mensaje-invitado" role="status" aria-live="polite"></p>
        </section>

        <section>
            <h2>Lista de invitados actuales</h2>
            <ul id="lista-invitados"></ul>
        </section>
    </main>

    <footer>
        <br>
        <a id="volver-perfil" href="/perfiles/perfilAdminstrador/perfil.html">Volver al menú del evento</a>
    </footer>

    <script>
        const form = document.getElementById("form-invitado");
        const message = document.getElementById("mensaje-invitado");
        const guestList = document.getElementById("lista-invitados");
        const submitButton = document.getElementById("submit-invitado");
        const eventIdValue = new URLSearchParams(window.location.search).get("event_id");
        const eventId = Number(eventIdValue);
        const guestsUrl = `/eventos/${encodeURIComponent(eventId)}/invitados`;

        if (!eventIdValue || !Number.isSafeInteger(eventId) || eventId < 1) {
            submitButton.disabled = true;
            message.textContent = "Selecciona un evento antes de agregar invitados.";
        } else {
            const profileUrl = new URL(document.getElementById("volver-perfil").href);
            profileUrl.searchParams.set("event_id", eventId);
            document.getElementById("volver-perfil").href = profileUrl.toString();
            form.addEventListener("submit", registerGuest);
            loadGuests();
        }

        async function registerGuest(event) {
            event.preventDefault();
            message.textContent = "Registrando usuario...";

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: form.elements.email.value,
                        password: form.elements.password.value,
                        first_name: form.elements.first_name.value,
                        last_name: form.elements.last_name.value,
                        role: form.elements.role.value,
                        event_id: eventId,
                    }),
                });
                const result = await response.json();
                if (!response.ok) {
                    message.textContent = result.detail || "No se pudo registrar el usuario.";
                    return;
                }

                form.reset();
                message.textContent = "Usuario agregado al evento correctamente.";
                await loadGuests(false);
            } catch {
                message.textContent = "No se pudo conectar con el servidor.";
            }
        }

        async function loadGuests(showLoading = true) {
            if (showLoading) {
                message.textContent = "Cargando invitados...";
            }

            try {
                const response = await fetch(guestsUrl);
                const guests = await response.json();
                if (!response.ok) {
                    throw new Error(guests.detail || "No se pudieron cargar los invitados.");
                }

                guestList.replaceChildren();
                for (const guest of guests) {
                    const item = document.createElement("li");
                    item.textContent = `${guest.name} (${guest.username}) - ${guest.role}`;
                    guestList.appendChild(item);
                }
                if (guests.length === 0) {
                    message.textContent = "Todavía no hay invitados para este evento.";
                } else if (showLoading) {
                    message.textContent = "";
                }
            } catch (error) {
                message.textContent = error.message || "No se pudieron cargar los invitados.";
            }
        }
    </script>
</body>
</html>
