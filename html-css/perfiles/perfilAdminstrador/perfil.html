<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil administrador - PP1</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Menú administrador</h1>
    <main> 
        <section> 
            <h2>Opciones</h2> 
            <ul> 
                <li><a id="crear-invitados" href="/perfiles/perfilAdminstrador/opciones/crear_invitados.html">crear invitados</a></li>
                <li><a id="eliminar-invitados" href="/perfiles/perfilAdminstrador/opciones/eliminar_invitados.html">Eliminar invitados</a></li>
            </ul> 
            <p id="event-message" role="status" aria-live="polite"></p>
        </section> 
    </main> 
    <a id="volver-eventos" href="/perfiles/perfilAdminstrador/crear_elegir_evento.html">Volver a elegir evento</a>
    <script>
        const eventId = new URLSearchParams(window.location.search).get("event_id");
        const eventMessage = document.getElementById("event-message");

        if (eventId) {
            for (const linkId of ["crear-invitados", "eliminar-invitados"]) {
                const link = document.getElementById(linkId);
                const target = new URL(link.href);
                target.searchParams.set("event_id", eventId);
                link.href = target.toString();
            }
            const backLink = document.getElementById("volver-eventos");
            const backTarget = new URL(backLink.href);
            backTarget.searchParams.set("event_id", eventId);
            backLink.href = backTarget.toString();
        } else {
            eventMessage.textContent = "Selecciona un evento antes de gestionar sus invitados.";
        }
    </script>
</body>
</html>
