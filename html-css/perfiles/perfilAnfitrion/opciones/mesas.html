<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas - PP1</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Invitados del evento</h1>
    <p>Esta lista muestra únicamente a las personas asociadas al evento seleccionado.</p>
    <ul id="lista-invitados"></ul>
    <p id="mensaje-invitados" role="status" aria-live="polite"></p>
    <p data-event-status role="status" aria-live="polite"></p>
    <footer>
        <a data-event-link href="/perfiles/perfilAnfitrion/perfil.html">Volver al menú</a>
    </footer>
    <script src="/event-context.js"></script>
    <script>
        const guestList = document.getElementById("lista-invitados");
        const message = document.getElementById("mensaje-invitados");

        if (window.pp1EventId) {
            loadGuests();
        }

        async function loadGuests() {
            message.textContent = "Cargando invitados...";
            try {
                const response = await fetch(`/eventos/${encodeURIComponent(window.pp1EventId)}/invitados`);
                const guests = await response.json();
                if (!response.ok) {
                    throw new Error(guests.detail || "No se pudieron cargar los invitados.");
                }

                guestList.replaceChildren();
                for (const guest of guests) {
                    const item = document.createElement("li");
                    item.textContent = guest.name;
                    guestList.appendChild(item);
                }
                message.textContent = guests.length ? "" : "Todavía no hay invitados para este evento.";
            } catch (error) {
                message.textContent = error.message || "No se pudieron cargar los invitados.";
            }
        }
    </script>
</body>
</html>
