<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header> 
        <h1>Confirmar asistencia</h1> 
    </header> 
    <form data-event-required>
  <fieldset>
    <legend>Asistiras al evento?</legend>
    <div>
      <input type="radio" id="si" name="asistencia" value="si" />
      <label for="si">Si</label>

      <input type="radio" id="no" name="asistencia" value="no" />
      <label for="no">No</label>
    </div>
    <div>
      <button type="submit">Enviar</button>
    </div>
  </fieldset>
    </form>
    <p data-event-status role="status" aria-live="polite"></p>
    <footer> <a data-event-link href="/perfiles/perfilInvitado/perfil.html">Volver al menu</a> </footer>
    <script src="/event-context.js"></script>
</body>
</html>
