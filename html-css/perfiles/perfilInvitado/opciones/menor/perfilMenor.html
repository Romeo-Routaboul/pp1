<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menores a cargo - PP1</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Menores a cargo</h1>
        <p>Consultá los menores asociados a tu cuenta y gestioná su participación en este evento.</p>
    </header>
    <main>
        <section data-event-required>
            <p id="mensaje-menores" role="status" aria-live="polite"></p>
            <h2>Menores asociados</h2>
            <ul id="lista-menores"></ul>
            <section id="opciones-menor" hidden>
                <h2 id="titulo-menor-seleccionado"></h2>
                <ul>
                    <li><a id="asistencia-menor" href="#">Confirmar asistencia</a></li>
                    <li><a id="restricciones-menor" href="#">Informar restricciones alimentarias</a></li>
                </ul>
            </section>
        </section>
        <p data-event-status role="status" aria-live="polite"></p>
    </main>
    <footer>
        <a data-event-link href="/perfiles/perfilInvitado/perfil.html">Volver al perfil del adulto</a>
    </footer>
    <script src="/event-context.js"></script>
    <script>
        const list = document.getElementById("lista-menores");
        const message = document.getElementById("mensaje-menores");
        const selectedMinorId = new URLSearchParams(window.location.search).get("minor_id");
        const user = window.pp1User;
        const canManage = Boolean(
            window.pp1EventId &&
            user &&
            user.role === "invitado" &&
            user.event_id === window.pp1EventId &&
            Number.isSafeInteger(user.id),
        );
        const minorsUrl = canManage
            ? `/eventos/${encodeURIComponent(window.pp1EventId)}/invitados/${encodeURIComponent(user.id)}/menores`
            : null;

        if (!canManage) {
            message.textContent = "Iniciá sesión con una cuenta de invitado para gestionar menores.";
        } else {
            loadMinors();
        }

        async function loadMinors(showLoading = true) {
            if (showLoading) {
                message.textContent = "Cargando menores...";
            }
            try {
                const response = await fetch(minorsUrl);
                const minors = await response.json();
                if (!response.ok) {
                    throw new Error(minors.detail || "No se pudieron cargar los menores.");
                }

                list.replaceChildren();
                for (const minor of minors) {
                    const item = document.createElement("li");
                    const details = document.createElement("span");
                    details.textContent = `${minor.name}, ${minor.age} años `;
                    const menuLink = document.createElement("a");
                    const menuUrl = new URL(
                        "/perfiles/perfilInvitado/opciones/menor/perfilMenor.html",
                        window.location.origin,
                    );
                    menuUrl.searchParams.set("event_id", window.pp1EventId);
                    menuUrl.searchParams.set("minor_id", minor.id);
                    menuLink.href = menuUrl.toString();
                    menuLink.textContent = "Gestionar";
                    item.append(details, menuLink);
                    list.appendChild(item);
                }
                const selectedMinor = minors.find(
                    (minor) => String(minor.id) === selectedMinorId,
                );
                if (selectedMinor) {
                    document.getElementById("titulo-menor-seleccionado").textContent =
                        `Opciones para ${selectedMinor.name}`;
                    const optionPaths = {
                        "asistencia-menor": "/perfiles/perfilInvitado/opciones/menor/asistenciaMenor.html",
                        "restricciones-menor": "/perfiles/perfilInvitado/opciones/menor/restriccionesMenor.html",
                    };
                    for (const [linkId, path] of Object.entries(optionPaths)) {
                        const link = document.getElementById(linkId);
                        const target = new URL(path, window.location.origin);
                        target.searchParams.set("event_id", window.pp1EventId);
                        target.searchParams.set("minor_id", selectedMinor.id);
                        link.href = target.toString();
                    }
                    document.getElementById("opciones-menor").hidden = false;
                } else {
                    document.getElementById("opciones-menor").hidden = true;
                }
                if (showLoading) {
                    message.textContent = minors.length
                        ? ""
                        : "Todavía no asociaste menores a tu cuenta.";
                }
            } catch (error) {
                message.textContent = error.message || "No se pudieron cargar los menores.";
            }
        }
    </script>
</body>
</html>
